  // Current language - default to English
  let currentLanguage = 'en';
  
  // Function to switch language
  function switchLanguage(lang) {
    if (!translations[lang]) return;
    
    currentLanguage = lang;
    
    // Update UI language toggle buttons
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    document.getElementById('lang' + lang.toUpperCase()).classList.add('active');
    
    // Update all elements with data-lang-key attribute
    document.querySelectorAll('[data-lang-key]').forEach(element => {
      const key = element.getAttribute('data-lang-key');
      
      if (translations[lang][key]) {
        // Special case for buttons
        if (element.tagName === 'BUTTON' && element.id === 'logToggleBtn') {
          // Keep the arrow at the end
          const isShowing = element.textContent.includes('▼');
          element.textContent = translations[lang][isShowing ? 'show_logs' : 'hide_logs'];
        } else {
          element.textContent = translations[lang][key];
        }
      }
    });
    
    // Redraw charts if they exist and we're displaying results
    if (window.classroomWrappedResults && document.getElementById('resultsContainer').style.display !== 'none') {
      displayWrappedContent(window.classroomWrappedResults);
    }
    
    // Store preference
    localStorage.setItem('classroom_wrapped_language', lang);
  }
  
  // Load saved language preference on page load
  document.addEventListener('DOMContentLoaded', function() {
    const savedLang = localStorage.getItem('classroom_wrapped_language');
    if (savedLang && translations[savedLang]) {
      switchLanguage(savedLang);
    }
  });

    const select = document.getElementById('courseSelect');
    const selectPrompt = translations[currentLanguage]['select_course'] || 'Select a course...';
    select.innerHTML = `<option value="">${selectPrompt}</option>`;
    courses.forEach(course => {
      select.innerHTML += `<option value="${course.id}">${course.name}</option>`;
    });
  }

  function loadTopics() {
    const courseId = document.getElementById('courseSelect').value;
    if (!courseId) return;

    const loadingMessage = translations[currentLanguage]['loading_course_data'] || "Loading course data...";
    document.getElementById('status').innerHTML = `<div class="loading-spinner inline-spinner"></div> ${loadingMessage}`;
    document.getElementById('analysisOptionsContainer').style.display = 'block';
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('status').innerHTML = '';
    
    // Setup date range listeners
    setupDateRangeToggle();
  }

  function setupDateRangeToggle() {
    const radioButtons = document.getElementsByName('timePeriod');
    const customDateContainer = document.getElementById('customDateContainer');
    
    for (const radio of radioButtons) {
      radio.addEventListener('change', function() {
        if (this.value === 'custom') {
          customDateContainer.style.display = 'block';
        } else {
          customDateContainer.style.display = 'none';
        }
      });
    }
  }

  function initLogToggle() {
    const logToggleBtn = document.getElementById('logToggleBtn');
    const logOutput = document.getElementById('logOutput');
    
    logToggleBtn.addEventListener('click', function() {
      const isVisible = logOutput.style.display !== 'none';
      
      if (isVisible) {
        logOutput.style.display = 'none';
        logToggleBtn.textContent = 'Show Logs ▼';
      } else {
        logOutput.style.display = 'block';
        logToggleBtn.textContent = 'Hide Logs ▲';
      }
    });
  }
  
  // Initialize log toggle on page load
  document.addEventListener('DOMContentLoaded', initLogToggle);
  
  // Function to add a log entry to the UI
  function addLogEntry(message, type = 'info', timestamp = null) {
    const logContainer = document.getElementById('logContainer');
    const logOutput = document.getElementById('logOutput');
    
    // Make log container visible
    logContainer.style.display = 'block';
    
    // Create log entry
    const entry = document.createElement('div');
    entry.className = `log-entry log-entry-${type}`;
    
    // Add timestamp if provided
    if (timestamp) {
      const timestampSpan = document.createElement('span');
      timestampSpan.className = 'log-entry-timestamp';
      timestampSpan.textContent = timestamp;
      entry.appendChild(timestampSpan);
    }
    
    // Add message
    entry.appendChild(document.createTextNode(message));
    
    // Add to log output
    logOutput.appendChild(entry);
    
    // Scroll to bottom
    logOutput.scrollTop = logOutput.scrollHeight;
  }

  function runAnalysis() {
    const courseId = document.getElementById('courseSelect').value;
    if (!courseId) {
      showError(translations[currentLanguage]['please_select_course'] || 'Please select a course');
      return;
    }
    
    // Get time period
    const timePeriod = document.querySelector('input[name="timePeriod"]:checked').value;
    let startDate = null;
    let endDate = null;
    
    if (timePeriod === 'custom') {
      startDate = document.getElementById('startDate').value;
      endDate = document.getElementById('endDate').value;
      
      if (!startDate || !endDate) {
        showError(translations[currentLanguage]['please_select_dates'] || 'Please select both start and end dates');
        return;
      }
    }
    
    // Clear previous logs
    document.getElementById('logOutput').innerHTML = '';
    // Show log container
    document.getElementById('logContainer').style.display = 'block';
    
    // Get slide counting option
    const countSlides = document.getElementById('countSlidesCheckbox').checked;

    const preparingMessage = translations[currentLanguage]['preparing_analysis'] || "Preparing analysis...";
    document.getElementById('status').innerHTML = `<div class="loading-spinner inline-spinner"></div> ${preparingMessage}`;
    document.getElementById('analyzeBtn').disabled = true;
    document.getElementById('cancelBtn').style.display = 'block';
    document.getElementById('progress').style.display = 'block';
    document.getElementById('resultsContainer').style.display = 'none';
    
    // Reset and start progress bar
    document.getElementById('progressBar').style.width = '5%';
    operationInProgress = true;
    
    // Add initial log entry
    const startingMessage = translations[currentLanguage]['starting_analysis'] || "Starting analysis for course ID: ";
    addLogEntry(`${startingMessage}${courseId}`, 'info');
    
    // Simulate progress while waiting for server response
    clearInterval(progressInterval);
    let progress = 5;
    progressInterval = setInterval(() => {
      if (progress < 90) {
        progress += 1;
        document.getElementById('progressBar').style.width = progress + '%';
        
        // Add periodic log updates for very long operations
        if (progress === 25) {
          addLogEntry(translations[currentLanguage]['fetching_course_data'] || 'Fetching course data...', 'info');
        } else if (progress === 50) {
          addLogEntry(translations[currentLanguage]['processing_submissions'] || 'Processing submissions...', 'info');
        } else if (progress === 75) {
          addLogEntry(translations[currentLanguage]['analyzing_materials'] || 'Analyzing course materials...', 'info');
        }
      }
    }, 1000);
    
    // Update status
    const analyzingMessage = translations[currentLanguage]['analyzing_classroom'] || "Analyzing classroom data...";
    document.getElementById('status').innerHTML = `<div class="loading-spinner inline-spinner"></div> ${analyzingMessage}`;
    
    // Pass necessary parameters
    google.script.run
      .withSuccessHandler(showResults)
      .withFailureHandler(showError)
      .franklinWrappedAnalysis(courseId, startDate, endDate, countSlides);
  }
  
  function cancelOperation() {
    if (!operationInProgress) return;
    
    addLogEntry(translations[currentLanguage]['cancelling_operation'] || 'Cancelling operation...', 'warning');
    const cancellingMessage = translations[currentLanguage]['cancelling_operation'] || "Cancelling operation...";
    document.getElementById('status').innerHTML = `<div class="loading-spinner inline-spinner"></div> ${cancellingMessage}`;
    
    // Clear progress simulation
    clearInterval(progressInterval);
    
    google.script.run
      .withSuccessHandler(function() {
        operationInProgress = false;
        document.getElementById('status').innerHTML = translations[currentLanguage]['operation_cancelled'] || 'Operation cancelled';
        document.getElementById('analyzeBtn').disabled = false;
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('progress').style.display = 'none';
        addLogEntry(translations[currentLanguage]['operation_cancelled_success'] || 'Operation cancelled successfully', 'warning');
      })
      .withFailureHandler(showError)
      .cancelOperation();
  }

  function showResults(results) {
    // Store results globally for CSV generation
    window.classroomWrappedResults = results; 
    
    console.log("[DEBUG] Received results from server:", results); // Log received object immediately
    
    // Clear progress simulation
    clearInterval(progressInterval);
    
    // Check for errors returned from server-side
    if (results && results.error) {
      console.log("[DEBUG] Server returned an error object.", results.error);
      
      // Handle the improved error object structure
      if (typeof results.error === 'object') {
        // New structure with message, cancelled, and timestamp
        const errorMsg = results.error.message || 'An unknown error occurred';
        const cancelled = results.error.cancelled || false;
        const timestamp = results.error.timestamp || null;
        
        showError(errorMsg, cancelled);
        
        // If we have a timestamp, add it to the error log
        if (timestamp) {
          // Add timestamp to the latest log entry
          const logEntries = document.querySelectorAll('.log-entry');
          if (logEntries.length > 0) {
            const lastEntry = logEntries[logEntries.length - 1];
            const timestampSpan = document.createElement('span');
            timestampSpan.className = 'log-entry-timestamp';
            timestampSpan.textContent = new Date(timestamp).toLocaleString();
            lastEntry.insertBefore(timestampSpan, lastEntry.firstChild);
          }
        }
      } else {
        // Legacy format (string error or simple object)
        showError(results.error, results.cancelled); 
      }
      return;
    }
    
    operationInProgress = false;
    document.getElementById('status').innerHTML = translations[currentLanguage]['analysis_completed'] || 'Analysis completed!';
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('progressBar').style.width = '100%';
    
    // Hide fetch logs button when results load successfully
    document.getElementById('fetchLogsBtn').style.display = 'none';
    
    // Reset progress bar after 2 seconds
    setTimeout(() => {
      document.getElementById('progress').style.display = 'none';
      document.getElementById('progressBar').style.width = '0%';
    }, 2000);
    
    // Display results in a Spotify Wrapped style
    const resultsContainer = document.getElementById('resultsContainer');
    resultsContainer.style.display = 'block';
    resultsContainer.innerHTML = ''; // Clear previous results
    
    // Check if results and necessary data exist
    console.log("[DEBUG] Checking for results.courseDetails before displaying..."); // Log before the check
    if (!results || !results.courseDetails) {
      showError("Analysis completed, but no course details were found.");
      console.error("[DEBUG] Invalid results object for display:", results); // Log the invalid object
      return;
    }
    
    // Add Charts.js library if not already present
    if (typeof Chart === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        script.onload = () => { displayWrappedContent(results, resultsContainer); };
        document.head.appendChild(script);
    } else {
        displayWrappedContent(results, resultsContainer);
    }

    // Show the raw data export button/area
    document.getElementById('rawDataContainer').style.display = 'block';
    document.getElementById('showDataBtn').onclick = () => generateAndShowCsv(window.classroomWrappedResults, document.getElementById('anonymizeCsvCheckbox').checked);
    document.getElementById('csvDisplayArea').style.display = 'none'; // Keep CSV hidden initially
    document.getElementById('csvOutput').value = ''; // Clear previous CSV
  }

  // Helper function to get computed style of CSS variables
  function getCssVariable(variableName) {
    return getComputedStyle(document.documentElement).getPropertyValue(variableName).trim();
  }

  // Function to format month abbreviations (Jan, Feb, etc.) from YYYY-MM format
  function formatMonthLabel(monthStr) {
    if (!monthStr || monthStr.length < 7) return monthStr;
    
    const monthNum = parseInt(monthStr.substring(5, 7)) - 1; // 0-indexed (0 = January)
    const year = monthStr.substring(0, 4);
    
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${monthNames[monthNum]} ${year}`;
  }

  function getChartThemeOptions() {
    const textColor = getCssVariable('--chart-text');
    const titleColor = getCssVariable('--text-primary');
    const gridColor = getCssVariable('--chart-grid');
    const tooltipBg = getCssVariable('--chart-tooltip-bg');
    const tooltipColor = getCssVariable('--chart-tooltip-text');
    
    // Define the vibrant color sequence using CSS variables
    const chartColors = [
      getCssVariable('--chart-color-1'),
      getCssVariable('--chart-color-2'),
      getCssVariable('--chart-color-3'),
      getCssVariable('--chart-color-4'),
      getCssVariable('--chart-color-5'),
      getCssVariable('--chart-color-6'),
    ];
    // Function to get a color from the sequence, cycling if needed
    const getColor = (index) => chartColors[index % chartColors.length]; 

    return {
      responsive: true,
      maintainAspectRatio: false,
      colorSequence: chartColors,
      getColor: getColor,
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            color: textColor, // Legend text color
            padding: 15, 
            font: {
                size: 12
            }
          }
        },
        title: { // Default title styling
          display: true,
          color: titleColor,
          font: {
            size: 16, 
            weight: 'bold'
          },
          padding: { top: 10, bottom: 20 }
        },
        tooltip: {
          enabled: true,
          backgroundColor: tooltipBg,
          titleColor: tooltipColor,
          bodyColor: tooltipColor,
          padding: 10,
          cornerRadius: 6,
          borderColor: gridColor, // Use grid color for subtle border
          borderWidth: 1,
          callbacks: {
            title: function(tooltipItems) {
              // Format month title in tooltips
              const title = tooltipItems[0].label;
              if (title && title.match(/^\d{4}-\d{2}$/)) {
                return formatMonthLabel(title);
              }
              return title;
            }
          }
        }
      },
      scales: {
        x: {
          border: { display: true, color: gridColor },
          grid: {
            color: gridColor,
            drawTicks: true,
          },
          ticks: {
            color: textColor,
            font: { size: 12, weight: '500' },
            padding: 8,
            autoSkip: true,
            maxRotation: 45,
            minRotation: 0,
            display: true,
            callback: function(value, index, values) {
              // Format YYYY-MM dates to abbreviated month names
              const label = this.getLabelForValue(value);
              if (label && label.match(/^\d{4}-\d{2}$/)) {
                return formatMonthLabel(label);
              }
              return label;
            }
          },
          title: { 
            display: true, 
            color: textColor,
            font: { size: 14, weight: '600'},
            padding: { top: 10, bottom: 10 }
          }
        },
        y: {
          border: { display: false }, // Hide y-axis line itself
          grid: {
            color: gridColor,
            drawTicks: false,
          },
          ticks: {
            color: textColor,
            font: { size: 11 },
            // Optional: format ticks (e.g., add commas)
             callback: function(value) { 
                if (Number.isInteger(value)) { return value; } // Only show integers for counts
             } 
          },
          title: {
            display: true,
            color: textColor,
            font: { size: 13, weight: '500'}
          },
          beginAtZero: true
        }
      }
    };
  }

  function displayWrappedContent(results, container) {
    // Course info
    const courseTitle = document.createElement('h2');
    courseTitle.textContent = results.courseDetails.name + ' Wrapped';
    courseTitle.className = 'animated';
    container.appendChild(courseTitle);
    
    // Add section padding
    const section1Padding = document.createElement('div');

  // Helper function to create a stat card
  function createStatCard(title, value, iconClass, animationClass) {
    const card = document.createElement('div');
    card.className = `stat-card ${animationClass}`;
    
    const icon = document.createElement('i');
    icon.className = `${iconClass} stat-icon`;
    card.appendChild(icon);
    
    const content = document.createElement('div');
    content.className = 'stat-content';
    
    const valueEl = document.createElement('div');
    valueEl.className = 'stat-value';
    valueEl.textContent = value;
    content.appendChild(valueEl);
    
    const titleEl = document.createElement('div');
    titleEl.className = 'stat-title';
    
    // Check if we have a translation key for this title
    const translationKey = title.toLowerCase().replace(/[^\w]+/g, '_');
    titleEl.setAttribute('data-lang-key', translationKey);
    
    // Set the title with translation if available
    const translatedTitle = translations[currentLanguage] && 
                           translations[currentLanguage][translationKey] ? 
                           translations[currentLanguage][translationKey] : 
                           title;
    titleEl.textContent = translatedTitle;
    
    content.appendChild(titleEl);
    card.appendChild(content);
    
    return card;
  }

  // Helper function to create a canvas element and its container
  function createCanvas(id, title, container, animationClass) {
    // First destroy any existing chart with this id to prevent memory leaks
    if (activeCharts[id]) {
      activeCharts[id].destroy();
      delete activeCharts[id];
    }
    
    const chartContainer = document.createElement('div');
    chartContainer.className = `chart-container ${animationClass}`;
    
    const chartTitle = document.createElement('h4');
    chartTitle.textContent = title;
    chartContainer.appendChild(chartTitle);
    
    const canvas = document.createElement('canvas');
    canvas.id = id;
    chartContainer.appendChild(canvas);
    
    container.appendChild(chartContainer);
    return canvas.getContext('2d');
  }

  function showError(error, cancelled = false) {
    console.error("Error handler:", error);
    clearInterval(progressInterval); // Stop any ongoing progress simulation
    operationInProgress = false;
    
    const statusDiv = document.getElementById('status');
    const errorMsg = (typeof error === 'string') ? error : (error.message || 'An unknown error occurred');
    statusDiv.innerHTML = cancelled ? 'Operation Cancelled' : `Error: ${errorMsg}`;
    statusDiv.style.color = cancelled ? 'orange' : 'red'; // Use orange for cancelled
    
    // Add error to logs
    addLogEntry(errorMsg, cancelled ? 'warning' : 'error');
    
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('progress').style.display = 'none';
    
    // Show server logs button when an error occurs
    document.getElementById('fetchLogsBtn').style.display = 'inline-block';
  }
  
  // Function to fetch and display server logs
  function fetchServerLogs() {
    // Add a loading message
    addLogEntry(translations[currentLanguage]['fetching_server_logs'] || 'Fetching server logs...', 'info');
    
    document.getElementById('fetchLogsBtn').disabled = true;
    
    google.script.run
      .withSuccessHandler(function(logs) {
        // Clear the loading message
        document.getElementById('fetchLogsBtn').disabled = false;
        
        if (!logs || logs.length === 0) {
          addLogEntry(translations[currentLanguage]['no_server_logs'] || 'No server logs available', 'warning');
          return;
        }
        
        // Add a separator
        addLogEntry('--- ' + (translations[currentLanguage]['server_logs'] || 'SERVER LOGS') + ' ---', 'info');
        
        // Add each log entry
        logs.forEach(function(log) {
          addLogEntry(log.message, log.level, log.timestamp);
        });
        
        // Make sure logs are visible
        document.getElementById('logOutput').style.display = 'block';
        document.getElementById('logToggleBtn').textContent = 'Hide Logs ▲';
      })
      .withFailureHandler(function(error) {
        document.getElementById('fetchLogsBtn').disabled = false;
        addLogEntry('Failed to fetch server logs: ' + error, 'error');
      })
      .getServerLogs(50); // Get up to 50 most recent log entries
  }

    link.rel = 'stylesheet';
    link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css';
    document.head.appendChild(link);
  })();

  // Log access
  google.script.run
    .withSuccessHandler(function(result) {
      console.log("Logged in as: " + (result.user || "unknown"));
    })
    .logAccess();

  /**
   * Generates a simplified CSV string from the results and displays it.
   * Allows optional anonymization of student names.
   * @param {object} results - The analysis results object.
   * @param {boolean} anonymize - Whether to anonymize student names.
   */
  function generateAndShowCsv(results, anonymize) {
    if (!results) {
      document.getElementById('csvOutput').value = "Error: No results data available.";
      document.getElementById('csvDisplayArea').style.display = 'block';
      return;
    }

    let csv = "Category,Metric,Value\n"; // Header

    // Course Details
    if (results.courseDetails) {
      csv += `Course,Name,"${results.courseDetails.name}"\n`;
      csv += `Course,ID,${results.courseDetails.id}\n`;
    }

    // Submission Stats
    if (results.submissionStats) {
       Object.entries(results.submissionStats).forEach(([key, value]) => {
         if (typeof value === 'number' || typeof value === 'string') { // Simple stats
           csv += `Submissions,${key},${value}\n`;
         } else if (key === 'submissionsByMonth' || key === 'studentFilesByMonth') { // Monthly data
            Object.entries(value).forEach(([month, count]) => {
              csv += `Submissions - ${key},${month},${count}\n`;
            });
         } else if (key === 'submissionsByDay') {
            const dayLabels = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            value.forEach((count, index) => {
               csv += `Submissions - By Day,${dayLabels[index]},${count}\n`;
            });
         } else if (key === 'submissionsByHour') {
             value.forEach((count, index) => {
               csv += `Submissions - By Hour,${index}:00,${count}\n`;
            });
         } else if (key === 'studentAttachmentTypes') {
             Object.entries(value).forEach(([type, count]) => {
               csv += `Submissions - Attachment Type,${type},${count}\n`;
            });
         } // Add more handling for submissionRatesByAssignment if needed
       });
    }
    
    // Assignment Creation Stats
    if (results.assignmentCreationStats) {
        Object.entries(results.assignmentCreationStats).forEach(([key, value]) => {
         if (typeof value === 'number' || typeof value === 'string') { 
           csv += `Assignments,${key},${value}\n`;
         } else if (key === 'withDeadlineByMonth' || key === 'withoutDeadlineByMonth') { 
            Object.entries(value).forEach(([month, count]) => {
              csv += `Assignments - ${key},${month},${count}\n`;
            });
         }
       });
    }
    
    // *** MODIFIED Engagement Data Section ***
    if (results.engagementData && results.engagementData.studentInteractions) {
        const header = anonymize ? "PseudoStudentID" : "StudentName";
        const sectionTitle = anonymize ? "Student Interactions (Anonymized)" : "Student Interactions";
        csv += `\n${sectionTitle}\n`;
        csv += `${header},SubmissionCount\n`; // Updated header based on anonymize flag

        let studentCounter = 1;
        // Ensure we iterate using studentId as key to access the name if needed
        Object.keys(results.engagementData.studentInteractions).forEach(studentId => {
            const interaction = results.engagementData.studentInteractions[studentId];
            const studentIdentifier = anonymize ? `Student_${studentCounter}` : `"${interaction.name}"`; // Use name or pseudo-ID, add quotes to name
            csv += `${studentIdentifier},${interaction.submissionCount}\n`;
            studentCounter++;
        });
    }

    // Early Bird / Night Owl Stats
    if (results.averageTimeStats) {
       csv += "\nSubmission Time Averages\n";
       csv += "Category,Student,AverageTime\n";
       if (results.averageTimeStats.earlyBird) {
           // Use anonymized name if flag is true
           const earlyBirdName = anonymize ? "Early Bird" : `"${results.averageTimeStats.earlyBird.name}"`; 
           csv += `Early Bird,${earlyBirdName},${results.averageTimeStats.earlyBird.time}\n`;
       } else {
            csv += `Early Bird,N/A,N/A\n`;
       }
        if (results.averageTimeStats.nightOwl) {
           const nightOwlName = anonymize ? "Night Owl" : `"${results.averageTimeStats.nightOwl.name}"`;
           csv += `Night Owl,${nightOwlName},${results.averageTimeStats.nightOwl.time}\n`;
       } else {
            csv += `Night Owl,N/A,N/A\n`;
       }
    }

    // Material and Slide Statistics
    if (results.materialStats && results.materialStats.presentations) {
        const presentations = results.materialStats.presentations;
        csv += "\nSlide Statistics\n";
        csv += `Presentations,Total Count,${presentations.count}\n`;
        csv += `Presentations,Total Slides,${presentations.totalSlides}\n`;
        
        if (presentations.count > 0) {
            const avgSlides = Math.round((presentations.totalSlides / presentations.count) * 10) / 10;
            csv += `Presentations,Average Slides Per Presentation,${avgSlides}\n`;
        }
    }

    document.getElementById('csvOutput').value = csv;
    document.getElementById('csvDisplayArea').style.display = 'block';
    console.log(`Generated CSV data (Anonymized: ${anonymize}).`);
  }
</script>

  </label>
