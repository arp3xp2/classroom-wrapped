<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classroom Wrapped</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <?!= include('Styles'); ?>
  </head>
  <body>
    <h1>CLASSROOM WRAPPED</h1>
    
    <!-- Theme Switch -->
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider"></div>
      </label>
    </div>
    
    <!-- Language Toggle -->
    <div class="language-toggle">
      <button id="langEN" class="lang-btn active" onclick="switchLanguage('en')">
        <img src="https://cdn.jsdelivr.net/gh/hampusborgos/country-flags@main/svg/gb.svg" alt="English" class="flag-icon">
        EN
      </button>
      <button id="langDE" class="lang-btn" onclick="switchLanguage('de')">
        <img src="https://cdn.jsdelivr.net/gh/hampusborgos/country-flags@main/svg/de.svg" alt="Deutsch" class="flag-icon">
        DE
      </button>
    </div>
    
    <div class="card">
      <h3 data-lang-key="select_course">Select Course</h3>
      <select id="courseSelect" onchange="loadTopics()">
        <option value="" data-lang-key="loading_courses">Loading courses...</option>
      </select>
    </div>
    
    <div id="analysisOptionsContainer" class="card" style="display:none;">
      <h3 data-lang-key="settings">Settings</h3>
      
      <div class="option-group">
        <h4 data-lang-key="time_period">Time Period</h4>
        <div class="option-item">
          <label>
            <input type="radio" name="timePeriod" value="all" checked>
            <span data-lang-key="entire_course">Entire Course</span>
          </label>
        </div>
        <div class="option-item">
          <label>
            <input type="radio" name="timePeriod" value="custom">
            <span data-lang-key="custom_date_range">Custom Date Range</span>
          </label>
        </div>
        <div id="customDateContainer" style="display:none; margin-top: 12px;">
          <div class="date-range">
            <label for="startDate" data-lang-key="start">Start:</label>
            <input type="date" id="startDate">
            <label for="endDate" data-lang-key="end">End:</label>
            <input type="date" id="endDate">
          </div>
        </div>
      </div>
      
      <div class="option-group" style="margin-top: 15px;">
        <h4 data-lang-key="analysis_options">Analysis Options</h4>
        <div class="option-item slide-count-option">
          <label>
            <input type="checkbox" id="countSlidesCheckbox">
            <span data-lang-key="count_slides">Count Material Slides (takes 5 mins extra)</span>
          </label>
        </div>
      </div>
    </div>
    
    <div class="button-container">
      <button id="analyzeBtn" onclick="runAnalysis()" disabled data-lang-key="generate_wrapped">
        Generate Classroom Wrapped
      </button>
      <button id="cancelBtn" onclick="cancelOperation()" style="display:none;" data-lang-key="cancel_analysis">
        Cancel Analysis
      </button>
    </div>
    
    <div id="status"></div>
    <div id="folderLink" style="display:none;"></div>
    
    <!-- Log Container -->
    <div id="logContainer" class="log-container" style="display:none;">
      <div class="log-header">
        <button id="logToggleBtn" class="log-toggle-button" data-lang-key="show_logs">Show Logs ▼</button>
        <button id="fetchLogsBtn" class="log-fetch-button" onclick="fetchServerLogs()" style="display:none;" data-lang-key="fetch_server_logs">Fetch Server Logs</button>
      </div>
      <pre id="logOutput" class="log-output" style="display:none;"></pre>
    </div>
    
    <div id="progress" style="display:none;" class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    
    <div id="resultsContainer" class="results-container" style="display:none;">
      <!-- Results will be displayed here -->
    </div>
    
    <!-- Raw Data Export Section -->
    <div id="rawDataContainer" class="raw-data-container card" style="display:none;">
      <h4 data-lang-key="raw_data">Raw Data (Anonymized)</h4>
      <button id="showDataBtn" class="button-secondary" data-lang-key="show_raw_data">Generate & Show Raw Data CSV</button>
      <div id="csvDisplayArea" style="display:none; margin-top: 15px;">
         <p data-lang-key="copy_data">Copy the data below:</p>
         <textarea id="csvOutput" rows="10" readonly></textarea>
      </div>
    </div>
    
    <?!= include('Scripts'); ?>
    
    <script>
      // Theme toggle functionality
      const toggleSwitch = document.querySelector('#checkbox');
      
      // Listen for toggle
      toggleSwitch.addEventListener('change', switchTheme, false);
      
      function switchTheme(e) {
        if (e.target.checked) {
          document.body.classList.add('light-mode');
          localStorage.setItem('theme', 'light');
        } else {
          document.body.classList.remove('light-mode');
          localStorage.setItem('theme', 'dark');
        }
      }
      
      // Check for saved theme preference
      const currentTheme = localStorage.getItem('theme');
      if (currentTheme) {
        if (currentTheme === 'light') {
          toggleSwitch.checked = true;
          document.body.classList.add('light-mode');
        }
      }
    </script>
  </body>
</html>
